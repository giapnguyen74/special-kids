name: sk_core
description: Shared core for Special Kids games (profile, progress log, speech, audio, start cue, sentence builder, rewards, parent dashboard, EN/VI strings).
publish_to: none
version: 1.0.0
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  http: ^1.6.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  assets:
    - assets/audio/notes/
